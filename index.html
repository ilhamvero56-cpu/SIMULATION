<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alur Kerja Regenerative Braking</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14214d;--mute:#5d6a8a;--line:#c8d1e0;--cy:#14a9cc;--am:#f08a24;--rd:#e5483f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1526;--card:#16203a;--ink:#e6ecf8;--mute:#9aa8c8;--line:#2d3b5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1526;--card:#16203a;--ink:#e6ecf8;--mute:#9aa8c8;--line:#2d3b5e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,system-ui,sans-serif;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(22px,4vw,32px);margin:0 0 4px;font-weight:900}
.sub{margin:0 0 16px;color:var(--mute)}
.stage{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#eef1f6}
svg{width:100%;height:auto;display:block}
.path{fill:none;stroke-width:16;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 36;opacity:0;transition:opacity .4s}
.path.on{opacity:1;animation:flow .8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-37}}
.path.sig{stroke:var(--am);filter:drop-shadow(0 0 7px var(--am))}
.path.pwr{stroke:#37d6ff;stroke-width:20;filter:drop-shadow(0 0 12px #14b8e6)}
.path.kin{stroke:#fff;filter:drop-shadow(0 0 8px #14214d)}
.path.hyd{stroke:var(--rd);filter:drop-shadow(0 0 8px var(--rd))}
.ring{fill:none;stroke-width:8;opacity:0;transition:opacity .4s}
.ring.am{stroke:var(--am)}.ring.cy{stroke:#19b8e6}.ring.rd{stroke:var(--rd)}
.ring.on{opacity:1;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:15;opacity:.55}}
.panel{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-height:132px}
.panel h2{margin:0 0 6px;font-size:20px}
.panel p{margin:0;max-width:70ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:18px;height:0;border-top:4px dotted;vertical-align:middle;margin-right:6px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
#play{background:var(--ink);color:var(--bg);border-color:var(--ink);min-width:96px}
.dots{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.dots button{width:38px;height:38px;padding:0;border-radius:50%}
.dots button[aria-current="true"]{background:var(--cy);border-color:var(--cy);color:#fff}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:14px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--cy)}
.mon{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.mon h3{margin:0 0 2px;font-size:18px}
.mon .note{margin:0 0 12px;font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cell{border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .3s,box-shadow .3s}
.cell.on{border-color:var(--cy);box-shadow:0 0 0 2px var(--cy)}
.cell b{display:block;font-size:12px;font-weight:700;color:var(--mute)}
.cell span{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.cell small{font-size:13px;color:var(--mute);margin-left:4px}
.blend{margin-top:14px}
.blend .tr{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.blend .tr i{display:block;height:100%}
#bg{background:#19b8e6}#bf{background:var(--rd)}
.blend p{margin:6px 0 0;font-size:13px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.path.on,.ring.on{animation:none}.path{stroke-dasharray:none}}
</style></head><body><main>
<h1>Alur Kerja Regenerative Braking</h1>
<p class="sub">Dari pedal rem sampai energi kembali ke baterai tegangan tinggi.</p>
<div class="stage">
<svg viewBox="0 0 2576 1438" role="img" aria-label="Ilustrasi mobil listrik dengan animasi aliran sinyal dan energi regenerative braking">
<image href="assets/mobil-listrik.jpg" x="0" y="0" width="2576" height="1438"/>
<path class="path sig" data-s="2" d="M1318,480 V548 H1130 L1095,572 H935 L900,596"/><path class="path sig" data-s="2" d="M930,600 H1010 L1030,640 H1290"/><path class="path sig" data-s="3" d="M960,648 L930,690"/><path class="path kin" data-s="3" d="M1230,1070 C1160,1060 1080,1030 1010,975"/><path class="path pwr" data-s="4" d="M960,900 C920,850 990,790 1010,735"/><path class="path pwr" data-s="5" d="M1010,730 C1100,770 1230,820 1380,850 L1620,830 L1740,740 L1790,700"/><path class="path sig" data-s="5" d="M1790,690 L1760,730"/><path class="path hyd" data-s="6" d="M1340,660 C1380,800 1330,980 1262,1060"/><ellipse class="ring am" data-s="1,2" cx="1320" cy="515" rx="60" ry="80"/><ellipse class="ring am" data-s="2,3" cx="810" cy="600" rx="110" ry="50"/><ellipse class="ring cy" data-s="3,4,5" cx="880" cy="690" rx="110" ry="60"/><ellipse class="ring cy" data-s="3,4" cx="830" cy="880" rx="150" ry="120"/><ellipse class="ring rd" data-s="6" cx="1335" cy="632" rx="70" ry="60"/><ellipse class="ring cy" data-s="5" cx="1800" cy="790" rx="220" ry="90"/><ellipse class="ring am" data-s="5" cx="1790" cy="668" rx="90" ry="45"/><ellipse class="ring rd" data-s="6" cx="1230" cy="1085" rx="130" ry="130"/>
</svg></div>
<div class="panel" aria-live="polite"><h2 id="t"></h2><p id="d"></p>
<div class="legend">
<span><i style="color:var(--am)"></i>Sinyal kendali</span>
<span><i style="color:#19b8e6"></i>Energi listrik (regen)</span>
<span><i style="color:#8a94b3"></i>Energi gerak roda</span>
<span><i style="color:var(--rd)"></i>Tekanan rem friksi</span></div></div>
<div class="ctrl"><button id="prev">Sebelumnya</button><button id="next">Berikutnya</button>
<div class="dots" id="dots" role="group" aria-label="Pilih langkah"></div></div>
<section class="mon" aria-label="Monitoring parameter"><h3>Monitoring parameter</h3><p class="note">Nilai simulasi untuk ilustrasi, bukan data pengukuran kendaraan nyata.</p><div class="grid" id="grid"></div><div class="blend"><div class="tr"><i id="bg"></i><i id="bf"></i></div><p><span id="bgt"></span><span id="bft"></span></p></div></section>
</main>
<script>
var S=[
{t:"Pengemudi menekan pedal rem atau melepas gas",d:"Sensor posisi pedal rem membaca seberapa dalam pedal ditekan dan seberapa cepat. Dari sinilah sistem tahu seberapa kuat pengemudi ingin memperlambat mobil."},
{t:"VCU membagi tugas pengereman",d:"Sinyal sensor masuk ke Vehicle Control Unit (VCU). VCU menghitung porsi pengereman: sebanyak mungkin lewat rem regeneratif, sisanya lewat rem friksi. Pembagian ini disebut brake blending."},
{t:"Motor traksi berubah menjadi generator",d:"VCU memerintahkan inverter agar motor tidak lagi menggerakkan roda. Roda justru memutar motor, dan hambatan listrik di dalam motor memperlambat mobil. Energi gerak berubah menjadi listrik."},
{t:"Inverter dua arah mengubah AC menjadi DC",d:"Motor menghasilkan arus bolak-balik (AC). Inverter daya dua arah menyearahkannya menjadi arus searah (DC) bertegangan tinggi, yang cocok untuk disimpan di baterai."},
{t:"Energi masuk ke baterai, BMS mengawasi",d:"Arus DC mengalir ke baterai tegangan tinggi. Battery Management System (BMS) memantau suhu, tegangan, dan tingkat pengisian, lalu membatasi arus jika baterai hampir penuh atau terlalu dingin."},
{t:"Rem friksi melengkapi bila perlu",d:"Pada pengereman keras, kecepatan sangat rendah, atau baterai tidak bisa menerima arus, electromechanical brake booster menambah tekanan ke rem cakram. Sisa gaya pengereman diambil alih rem friksi."}
];
var cur=0;
var $=function(i){return document.getElementById(i)},dots=$("dots");
S.forEach(function(_,i){var b=document.createElement("button");b.textContent=i+1;b.setAttribute("aria-label","Langkah "+(i+1));b.onclick=function(){go(i)};dots.appendChild(b)});
function go(i){
cur=(i+S.length)%S.length;var n=String(cur+1);
$("t").textContent=(cur+1)+". "+S[cur].t;$("d").textContent=S[cur].d;
document.querySelectorAll("[data-s]").forEach(function(el){el.classList.toggle("on",el.getAttribute("data-s").split(",").indexOf(n)>-1)});
Array.prototype.forEach.call(dots.children,function(b,j){b.setAttribute("aria-current",j===cur)})}
$("prev").onclick=function(){go(cur-1)};$("next").onclick=function(){go(cur+1)};
var M=[
{k:"spd",l:"Kecepatan",u:"km/j",d:0,n:1,v:[80,80,74,66,58,50]},
{k:"ped",l:"Posisi pedal rem",u:"%",d:0,n:1,i:0,s:"1,2",v:[35,35,35,35,35,70]},
{k:"trq",l:"Torsi regen",u:"Nm",d:0,n:1,s:"3",v:[0,0,180,175,165,120]},
{k:"rpm",l:"Putaran motor",u:"rpm",d:0,n:1,s:"3",v:[7200,7200,6700,5900,5200,4500]},
{k:"pw",l:"Daya regen",u:"kW",d:1,n:1,s:"3,4",v:[0,0,28,26.5,25,16]},
{k:"cur",l:"Arus pengisian",u:"A",d:0,n:1,s:"4,5",v:[0,0,0,65,62,38]},
{k:"vb",l:"Tegangan baterai",u:"V",d:0,n:0,s:"5",v:[396,396,396,398,404,405]},
{k:"soc",l:"Level baterai (SoC)",u:"%",d:1,n:0,s:"5",v:[68,68,68,68.1,68.3,68.4]},
{k:"tmp",l:"Suhu baterai",u:"°C",d:1,n:0,s:"5",v:[31,31,31,31.2,31.8,32.2]},
{k:"bar",l:"Tekanan rem friksi",u:"bar",d:0,n:1,s:"6",v:[0,0,0,0,0,35]}
];
var BL=[[0,0],[0,0],[100,0],[100,0],[100,0],[62,38]];
var cells={},cv={},tg={},rg=0,fr=0,rgc=0,frc=0;
M.forEach(function(m){var c=document.createElement("div");c.className="cell";if(m.s)c.setAttribute("data-s",m.s);c.innerHTML="<b>"+m.l+"</b><span></span><small>"+m.u+"</small>";$("grid").appendChild(c);cells[m.k]=c.querySelector("span");cv[m.k]=m.i!==undefined?m.i:m.v[0];tg[m.k]=m.v[0]});
var _go=go;
go=function(i){_go(i);M.forEach(function(m){tg[m.k]=m.v[cur]});rg=BL[cur][0];fr=BL[cur][1]};
var rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
function mtick(t){
M.forEach(function(m,i){var k=m.k;cv[k]=rm?tg[k]:cv[k]+(tg[k]-cv[k])*0.05;var x=cv[k];if(m.n&&Math.abs(x)>1&&!rm)x*=1+0.006*Math.sin(t/230+i*2);cells[k].textContent=x.toFixed(m.d)});
rgc=rm?rg:rgc+(rg-rgc)*0.05;frc=rm?fr:frc+(fr-frc)*0.05;
$("bg").style.width=rgc+"%";$("bf").style.width=frc+"%";
$("bgt").textContent="Rem regeneratif "+Math.round(rgc)+"%";$("bft").textContent="Rem friksi "+Math.round(frc)+"%";
requestAnimationFrame(mtick)}
go(0);requestAnimationFrame(mtick);
</script></body></html>
